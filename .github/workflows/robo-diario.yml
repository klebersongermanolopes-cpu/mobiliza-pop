# Robô diário: coleta dados públicos, o Gemini escreve os rascunhos e abre um pedido de revisão (pull request).
# Nada é publicado sem uma pessoa aprovar o pull request.
# Usa a chave gratuita do Gemini (https://aistudio.google.com/apikey), guardada no segredo GEMINI_API_KEY.
name: Robô diário

on:
  schedule:
    - cron: "17 11 * * *" # 8h17 em Brasília
    - cron: "17 20 * * *" # 17h17 em Brasília
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: robo-diario
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir se a chave do Gemini está cadastrada
        env:
          CHAVE: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::error::Falta o segredo GEMINI_API_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Coletar dados públicos (Câmara, Senado, notícias)
        timeout-minutes: 10
        run: node robo/coletar.mjs

      - name: Gemini escreve os rascunhos
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node robo/escrever-ia.mjs

      - name: Conferir o conteúdo
        run: node robo/validar.mjs

      - name: Preparar descrição do pedido de revisão
        run: |
          [ -f robo/pauta/relatorio.md ] || echo "O robô rodou, mas não deixou relatório. Confira as mudanças na aba Files changed." > robo/pauta/relatorio.md
          echo "QUANDO=$(TZ=America/Sao_Paulo date '+%d/%m às %Hh%M')" >> "$GITHUB_ENV"

      - name: Abrir pedido de revisão
        uses: peter-evans/create-pull-request@v7
        with:
          branch: robo/rascunhos
          delete-branch: true
          commit-message: "Rascunhos do robô (${{ env.QUANDO }})"
          title: "Rascunhos do robô: ${{ env.QUANDO }}"
          body-path: robo/pauta/relatorio.md
          labels: revisar
          add-paths: |
            site/data/*.json
